<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demonstration experiment</title>
<style>:root {
  --bg: #F6F8FA; --panel: #FFFFFF; --fg: #1A2127; --muted: #56636E;
  --border: #D3DAE0; --accent: #0F6B8C; --accent-fg: #FFFFFF;
  --select: #DCEBF2; --hint: #A11A1A;
  --plot-bg: #FFFFFF; --plot-fg: #222222; --plot-muted: #56636E;
  --plot-grid: #E3E8EC;
  color-scheme: light;
}
:root[data-eff="dark"] {
  --bg: #14181C; --panel: #1C2227; --fg: #E6EBEF; --muted: #9AA7B2;
  --border: #323B43; --accent: #4FB3D9; --accent-fg: #0B1116;
  --select: #26414F; --hint: #FF8A8A;
  --plot-bg: #0F1317; --plot-fg: #E6EBEF; --plot-muted: #9AA7B2;
  --plot-grid: #262E35;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
.muted { color: var(--muted); }
.small { font-size: 12px; }
h1 { font-size: 20px; margin: 0; }
h2 { font-size: 16px; margin: 18px 0 8px; }
h3 { font-size: 14px; margin: 14px 0 6px; }
button, select, input[type="search"] {
  font: inherit; color: var(--fg); background: var(--panel);
  border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px;
}
button { cursor: pointer; }
button:hover { border-color: var(--accent); }
button:focus-visible, select:focus-visible, input:focus-visible,
.lbl:focus-visible, .tab-btn:focus-visible, .tw:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 1px;
}
.boot { padding: 40px; text-align: center; color: var(--muted); }
.boot.error { color: var(--hint); }

.top {
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; padding: 12px 20px; background: var(--panel);
  border-bottom: 1px solid var(--border);
}
.actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.badge { font-size: 11px; padding: 2px 9px; border: 1px solid var(--border); border-radius: 12px; color: var(--muted); }
.field { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.field select, .field input[type="range"] { color: var(--fg); }

.layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: calc(100vh - 110px); }
.side { border-right: 1px solid var(--border); background: var(--panel); padding: 12px; overflow: auto; }
.side-tools { display: flex; gap: 6px; margin-bottom: 10px; }
.side-tools input { flex: 1; min-width: 0; }
main { padding: 14px 20px 30px; min-width: 0; }

.tree { font-size: 13px; }
.tree ul { list-style: none; margin: 0; padding-left: 18px; }
.tree > ul { padding-left: 0; }
.row { display: flex; align-items: center; gap: 4px; padding: 2px 0; }
.row:hover { background: var(--select); }
.row.selected { background: var(--select); font-weight: 600; }
.tw { width: 20px; padding: 0; border: 0; background: none; color: var(--muted); }
.tw.leaf { visibility: hidden; }
.lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.cnt { color: var(--muted); font-size: 11px; }
.swatch { width: 10px; height: 10px; border-radius: 2px; flex: none; }
li.hidden { display: none; }
li.collapsed > ul { display: none; }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 12px; flex-wrap: wrap; }
.tab-btn { border: 0; border-bottom: 3px solid transparent; border-radius: 0; background: none; color: var(--muted); padding: 8px 14px; }
.tab-btn[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); font-weight: 600; }
.tab[hidden] { display: none; }

.controls { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 8px; }
.levelbar input[type="range"] { flex: 1; min-width: 160px; max-width: 420px; }
.panels { display: grid; grid-template-columns: repeat(auto-fill, minmax(440px, 1fr)); gap: 14px; }
.panels.one { grid-template-columns: minmax(0, 1fr); }
.panel { background: var(--plot-bg); border: 1px solid var(--border); border-radius: 8px; padding: 6px; min-width: 0; }
.panel canvas { display: block; width: 100%; height: 320px; cursor: crosshair; }
.panels.one .panel canvas { height: 460px; }
.panel-foot { display: flex; align-items: center; gap: 8px; }
.panel-foot .readout { flex: 1; min-width: 0; }
.pngbtn { font-size: 11px; padding: 1px 8px; border-radius: 4px; flex: none; }
.readout { min-height: 18px; padding: 2px 6px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.fitbox { padding: 4px 6px 6px; color: var(--plot-fg); }
.fitbox .fit-head { margin: 2px 0 6px; font-size: 12px; color: var(--muted); }
.fitbox table.grid { width: 100%; font-size: 12px; font-variant-numeric: tabular-nums; background: var(--plot-bg); }
.fitbox table.grid td.num, .fitbox table.grid th.num { text-align: right; }
.fitbox table.grid tr.off td { opacity: 0.45; }
.fitbox .sw { display: inline-block; width: 11px; height: 11px; border-radius: 3px; vertical-align: -1px; }
button[aria-pressed="true"] { border-color: var(--accent); background: var(--select); }
.identifying .panel canvas { cursor: cell; }
.idbox { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; margin-bottom: 10px; }
.idbox p { margin: 6px 0; }
.idwin { width: 5em; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; padding: 2px 8px; border-radius: 12px; }
.depth-panel canvas { display: block; width: 100%; height: 360px; cursor: pointer; }
.depth-panel { margin-bottom: 12px; }
table.quant { font-variant-numeric: tabular-nums; }
table.quant td.num, table.quant th.num { text-align: right; }
table.quant tr.off td { opacity: 0.45; }
table.quant tr.state td { color: var(--muted); border-top-style: dotted; }
.empty { color: var(--muted); padding: 40px 10px; text-align: center; }
.empty[hidden] { display: none; }

figure { margin: 0 0 22px; }
figure img { max-width: 100%; height: auto; border: 1px solid var(--border); border-radius: 6px; background: #fff; }
figcaption { margin-top: 6px; white-space: pre-wrap; }
table.kv, table.grid { border-collapse: collapse; font-size: 13px; }
table.kv th { text-align: left; font-weight: 600; color: var(--muted); padding: 3px 18px 3px 0; vertical-align: top; white-space: nowrap; }
table.kv td { padding: 3px 0; }
table.grid th, table.grid td { border: 1px solid var(--border); padding: 4px 8px; text-align: left; white-space: nowrap; }
table.grid th { background: var(--panel); color: var(--muted); }
.scroll { overflow: auto; max-width: 100%; }
.prose { white-space: pre-wrap; max-width: 78ch; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; margin: 0 0 10px; font: inherit; }
.holder-wrap canvas { max-width: 100%; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; display: block; }
.holder-info { margin-top: 10px; min-height: 30px; }
.cam-wrap canvas { max-width: 100%; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; display: block; }
.mapbtn { font-size: 11px; padding: 0 6px; border-radius: 4px; }
.maps-view { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 12px; }
.maps-view canvas { display: block; width: 100%; background: var(--plot-bg); border: 1px solid var(--border); border-radius: 6px; }
#mapCanvas { cursor: crosshair; }
#specCanvas { cursor: col-resize; }
.map-read { min-height: 20px; margin-top: 6px; font-variant-numeric: tabular-nums; }
.swatch-bar { display: inline-block; width: 90px; height: 10px; border-radius: 3px; vertical-align: middle; border: 1px solid var(--border); }
.foot { padding: 10px 20px 24px; }
.note { margin: 6px 0; }

@media (max-width: 820px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .side { border-right: 0; border-bottom: 1px solid var(--border); max-height: 260px; }
  .panels { grid-template-columns: minmax(0, 1fr); }
  .maps-view { grid-template-columns: minmax(0, 1fr); }
}

@media print {
  :root, :root[data-eff="dark"] {
    --bg: #FFFFFF; --panel: #FFFFFF; --fg: #000000; --muted: #444444;
    --border: #BBBBBB; --plot-bg: #FFFFFF; --plot-fg: #000000;
    --plot-muted: #444444; --plot-grid: #DDDDDD; color-scheme: light;
  }
  body { font-size: 11pt; }
  .side, .actions, .controls, .pngbtn, .tabs, .foot .noprint, .holder-info button,
  .empty, #notes, .idbox { display: none !important; }
  .layout { display: block; }
  main { padding: 0; }
  .top { border: 0; padding: 0 0 8px; }
  .panels { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8mm; }
  .panels.one { grid-template-columns: minmax(0, 1fr); }
  .panel, figure, table { break-inside: avoid; }
  .panel canvas { height: 62mm; }
  .panels.one .panel canvas { height: 110mm; }
}
</style>
</head>
<body>
<div id="boot" class="boot" role="status">Loading the data&hellip;</div>
<div id="app" hidden>
  <header class="top">
    <div class="ident">
      <h1 id="title"></h1>
      <p id="subtitle" class="muted"></p>
    </div>
    <div class="actions">
      <span class="badge" title="This page shows the data. Nothing you do here changes the files or is saved back.">Read-only</span>
      <label class="field">Theme
        <select id="theme">
          <option value="auto">Auto</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </label>
      <button type="button" id="zipall" title="One ZIP with a CSV per spectrum, the quantification table and the text notes">Download everything</button>
      <button type="button" id="print">Print</button>
    </div>
  </header>
  <div class="layout">
    <aside class="side" aria-label="Samples and spectra">
      <div class="side-tools">
        <input id="filter" type="search" placeholder="Filter samples and spectra"
               aria-label="Filter samples and spectra" autocomplete="off">
        <button type="button" id="untick" title="Untick every spectrum">Clear</button>
      </div>
      <div id="tree" class="tree" role="tree"></div>
      <p id="tickcount" class="muted small"></p>
    </aside>
    <main>
      <nav class="tabs" role="tablist" id="tabs"></nav>
      <section id="tab-plot" class="tab" role="tabpanel">
        <div class="controls" id="controls">
          <label class="field">View
            <select id="mode"><option value="stack">Stack</option><option value="overlay">Overlay</option></select>
          </label>
          <label class="field">Normalise
            <select id="norm"><option value="none">None</option><option value="max">Max = 1</option><option value="area">Area = 1</option></select>
          </label>
          <label class="field" id="offsetField">Offset
            <input type="range" id="offset" min="0" max="3" step="0.05" value="0.6">
          </label>
          <label class="field">Energy
            <select id="scale"><option value="Binding">Binding</option><option value="Kinetic">Kinetic</option></select>
          </label>
          <button type="button" id="resetzoom" title="Undo zooming on every panel">Reset zoom</button>
          <button type="button" id="csv" title="Download the ticked spectra as CSV">Download CSV</button>
          <button type="button" id="identify" aria-pressed="false" title="Click a peak on a plot to see which element lines lie near it">Identify peaks</button>
          <label class="field" id="autoField" hidden title="Automatic labels from approximate line positions: check them before relying on them"><input type="checkbox" id="autolabel"> Label survey peaks</label>
          <span id="nearbyField" hidden>
            <label class="field" title="Another candidate photoelectron line near an identified peak (up to 2, nearest first), in a different colour, to help confirm speciation"><input type="checkbox" id="nearbySecondary"> Secondary</label>
            <label class="field" title="A candidate Auger line near an identified peak, in a different colour"><input type="checkbox" id="nearbyAuger"> Auger</label>
          </span>
        </div>
        <div class="idbox" id="idbox" hidden></div>
        <div class="controls levelbar" id="levelbar" hidden>
          <label class="field"><input type="checkbox" id="levelOn"> One depth level at a time</label>
          <button type="button" id="levPrev" title="Previous level (left arrow)" aria-label="Previous level">&#9664;</button>
          <input type="range" id="level" min="0" max="0" step="1" aria-label="Depth level">
          <button type="button" id="levNext" title="Next level (right arrow)" aria-label="Next level">&#9654;</button>
          <button type="button" id="levPlay" aria-pressed="false" title="Step through the levels">Play</button>
          <span id="levelText" class="muted"></span>
        </div>
        <div class="controls fitbar" id="fitbar" hidden>
          <span class="muted">Fit</span>
          <label class="field"><input type="checkbox" id="fit-components" checked> Components</label>
          <label class="field"><input type="checkbox" id="fit-envelope" checked> Envelope</label>
          <label class="field"><input type="checkbox" id="fit-background" checked> Background</label>
          <label class="field"><input type="checkbox" id="fit-residual"> Residual</label>
        </div>
        <p id="notes" class="muted small"></p>
        <div id="panels" class="panels"></div>
        <p id="empty" class="empty">Tick spectra in the list to plot them. Spectra with the same element name share a panel.
          Drag on a plot to zoom, double-click to reset.</p>
      </section>
      <section id="tab-quant" class="tab" role="tabpanel" hidden></section>
      <section id="tab-depth" class="tab" role="tabpanel" hidden></section>
      <section id="tab-figures" class="tab" role="tabpanel" hidden></section>
      <section id="tab-meta" class="tab" role="tabpanel" hidden></section>
      <section id="tab-notes" class="tab" role="tabpanel" hidden></section>
      <section id="tab-methods" class="tab" role="tabpanel" hidden></section>
      <section id="tab-holder" class="tab" role="tabpanel" hidden></section>
      <section id="tab-cameras" class="tab" role="tabpanel" hidden></section>
      <section id="tab-maps" class="tab" role="tabpanel" hidden></section>
    </main>
  </div>
  <footer class="foot muted small" id="foot"></footer>

<script>'use strict';
/* eXPoSe SpectraDeck - offline data browser.
   No libraries, no network. The first half is pure logic (decoding, axes,
   ticks, normalising, grouping, CSV) and is unit-tested under Node; the
   second half builds the page and only runs where there is a document. */

    return a;

    if (typeof DecompressionStream === 'undefined') {
      return Promise.reject(new Error('This browser has no DecompressionStream'));

      .pipeThrough(new DecompressionStream('gzip'));
    return new Response(stream).text().then(JSON.parse);
  };

  V.axisValues = function (e) {
    if (Array.isArray(e)) return e;
    var out = new Array(e.n);
    for (var i = 0; i < e.n; i++) out[i] = e.x0 + e.dx * i;
    return out;
  };

  /* --------------------------------------------------------------- maths */
  V.niceFloor = function (x) {              /* down to 1, 2 or 5 x 10^n */
    if (!(x > 0) || !isFinite(x)) return 1;
    var e = Math.floor(Math.log10(x)), m = x / Math.pow(10, e);
    return (m >= 5 ? 5 : m >= 2 ? 2 : 1) * Math.pow(10, e);
  };
  V.niceStep = function (range, target) {   /* a round step, ~target ticks */
    var raw = range / Math.max(1, target), mag = Math.pow(10, Math.floor(Math.log10(raw)));
    var m = raw / mag;
    return (m < 1.5 ? 1 : m < 3 ? 2 : m < 7 ? 5 : 10) * mag;
  };
  V.niceTicks = function (lo, hi, target) {

    ctx.fillStyle = C.muted; ctx.font = font(11); ctx.textAlign = 'right';

    ctx.beginPath(); ctx.moveTo(lay.l, by + 0.5); ctx.lineTo(lay.l + lay.w, by + 0.5); ctx.stroke();

      ctx.font = font(11); ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      V.niceTicks(ylo, yhi, Math.max(3, Math.round(lay.h / 50))).forEach(function (t) {

        ctx.strokeStyle = C.grid; ctx.beginPath(); ctx.moveTo(lay.l, y); ctx.lineTo(lay.l + lay.w, y); ctx.stroke();
        ctx.strokeStyle = C.muted; ctx.beginPath(); ctx.moveTo(lay.l - 4, y); ctx.lineTo(lay.l, y); ctx.stroke();
        ctx.fillText(V.fmtY(t), lay.l - 7, y);

      ctx.fillStyle = C.fg; ctx.font = font(12); ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      var r0 = items[0].reg;
      ctx.fillText(S.norm === 'none' ? r0.ylabel + (r0.yunits ? ' (' + r0.yunits + ')' : '') : r0.ylabel + ' (normalised)', 0, 0);

    } else {

      .sort(function (a, b) { return (b.mine - a.mine) || (a.auto - b.auto); }).forEach(function (m) {

  /* every marker to draw on a panel, each with its own spectrum's photon energy;
     the same label at (almost) the same energy on several spectra is drawn once */
  function panelMarks(g) {
    var out = [], seen = {};
    var mark = function (be, label, kin, hv, auto, mine, tier) {
      var k = label + '|' + Math.round(be * 2) + '|' + (kin ? 'k' : 'b');
      if (seen[k]) return;
      seen[k] = true;
      out.push({ be: be, label: label, kin: !!kin, hv: hv, auto: auto, mine: mine, tier: tier || null });
    };
    g.items.forEach(function (s) {
      var lists = [[s.reg.markers || [], false, false], [S.ident.auto ? (s.reg.auto || []) : [], true, false],
                   [S.ident.extra[s.id] || [], false, true]];
      lists.forEach(function (l) {
        l[0].forEach(function (m) { mark(m.be, m.label, m.kin, s.reg.hv, l[1], l[2]); });
      });
      /* other candidate lines near each of this spectrum's own committed
         markers, when the Secondary/Auger toggles ask for them */
      if (S.ident.secondary || S.ident.auger) {
        (s.reg.markers || []).forEach(function (m) {
          if (m.kin) return;
          V.nearbyLines(m.be, S.ident.win, S.data.elements, s.reg.hv, m.label,
                        S.ident.secondary, S.ident.auger, 2).forEach(function (x) {
            mark(x.be, x.label, false, s.reg.hv, false, false, x.tier);
          });
        });
      }
    });

  }
  /* click a peak in identify mode: list the element lines near it */
  function identifyAt(P, xpx) {
    var v = P.lay.toX(xpx), item = P.items[0], hv = item.reg.hv;
    var be = P.lay.ax.label === 'Kinetic energy' ? (hv ? hv - v : null) : v;
    S.ident.clicked = be === null ? null : { be: be, item: item, hv: hv };
    renderIdBox();
  }
  function renderIdBox() {
    var box = clear($('idbox')), I = S.ident;
    box.hidden = !I.on;
    if (!I.on) return;
    var win = h('input', { type: 'number', min: '0.1', step: '0.5', value: String(I.win), 'aria-label': 'Window in eV', class: 'idwin' });
    win.addEventListener('change', function () { var v = parseFloat(win.value); I.win = v > 0 ? v : 2; renderIdBox(); });
    box.appendChild(h('div', { class: 'controls' }, h('strong', { text: 'Identify peaks' }),
      h('label', { class: 'field' }, 'Window ± ', win, ' eV')));
    if (!I.clicked) {
      box.appendChild(h('p', { class: 'muted small', text: 'Click a peak on a plot to see which element lines lie near it. Line positions are approximate (chemical shifts of a few eV are normal).' }));
    } else {
      var c = V.candidates(I.clicked.be, I.win, S.data.elements, I.clicked.hv);
      box.appendChild(h('p', { class: 'small', text: 'Peak at ' + I.clicked.be.toFixed(2) + ' eV: ' + (c.length ? c.length + ' candidate line' + (c.length > 1 ? 's' : '') + ' within ± ' + I.win + ' eV (best first). Click one to label the peak.' : 'no line within ± ' + I.win + ' eV.') }));
      var row = h('div', { class: 'chips' });
      c.slice(0, 12).forEach(function (x) {
        var b = h('button', { type: 'button', class: 'chip', title: x.label + ' at ' + x.be.toFixed(1) + ' eV (' + (x.d >= 0 ? '+' : '') + x.d.toFixed(1) + ' eV from the peak)', text: x.label + '  ' + x.be.toFixed(1) + ' (' + (x.d >= 0 ? '+' : '') + x.d.toFixed(1) + ')' });
        b.addEventListener('click', function () {
          var id = I.clicked.item.id;
          (I.extra[id] = I.extra[id] || []).push({ be: I.clicked.be, label: x.label });

    if (n) {

      clr.addEventListener('click', function () { I.extra = {}; renderIdBox(); requestRender(); });
      box.appendChild(h('p', { class: 'small' }, clr, ' Labels picked here last for this session only; the app\'s own labels are kept in the workbook.'));

  /* a polyline through the points that have a value; a gap starts a new stroke */
  function strokeCurve(ctx, xs, ys, X, Y) {
    var pen = false;
    ctx.beginPath();
    for (var k = 0; k < xs.length; k++) {

      if (pen) ctx.lineTo(X(xs[k]), Y(ys[k])); else { ctx.moveTo(X(xs[k]), Y(ys[k])); pen = true; }
    }

  }

  function fillBetween(ctx, xs, top, lo, X, Y) {
    var k = 0, n = xs.length;
    while (k < n) {
      while (k < n && (top[k] === null || lo[k] === null)) k++;
      var a = k;
      while (k < n && top[k] !== null && lo[k] !== null) k++;

      ctx.beginPath();
      for (var i = a; i < k; i++) { if (i === a) ctx.moveTo(X(xs[i]), Y(top[i])); else ctx.lineTo(X(xs[i]), Y(top[i])); }

      if (S.fit.background && fr.bg) {

        strokeCurve(ctx, xs, fr.bg, X, Y); ctx.setLineDash([]);

      if (S.fit.components) {

          var lo = fr.bg || zero, top = cv.map(function (v, k) { return v === null || lo[k] === null ? null : lo[k] + v; });

        ctx.beginPath(); ctx.moveTo(lay.l, Y(resBase)); ctx.lineTo(lay.l + lay.w, Y(resBase)); ctx.stroke(); ctx.setLineDash([]);
        ctx.strokeStyle = C.muted; ctx.lineWidth = 1; strokeCurve(ctx, xs, res, X, Y);
        ctx.fillStyle = C.muted; ctx.font = font(10); ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';

  function fitLegend(ctx, C, lay, s, font) {

    ctx.font = font(11); ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    st.forEach(function (x, i) {

      ctx.fillStyle = fitStateColour(x.name); ctx.globalAlpha = 0.5; ctx.fillRect(lay.l + 8, y - 5, 10, 10); ctx.globalAlpha = 1;
      ctx.fillStyle = C.fg;

    });
    ctx.textBaseline = 'alphabetic';
  }

  function onMove(P, e) {
    var lay = P.lay;
    if (!lay) return;
    var x = px(P, e), y = py(P, e);
    if (P.drag) P.drag.b = Math.max(lay.l, Math.min(lay.l + lay.w, x));
    if (x < lay.l || x > lay.l + lay.w || y < lay.t || y > lay.t + lay.h) {
      P.hover = null; P.readout.textContent = ''; redraw(P); return;
    }
    P.hover = x;
    var v = lay.toX(x), r0 = P.items[0].reg, a0 = lay.ax;
    var be = null, ke = null;
    if (a0.label === 'Kinetic energy') { ke = v; be = r0.hv ? r0.hv - v : null; }
    else { be = v; ke = r0.hv && r0.binding ? r0.hv - v : null; }

    });
    if (best) {
      parts.push((P.items.length > 1 ? V.traceLabel(best.s, S.data.files.length > 1) + ': ' : '') +
        V.fmtY(best.raw) + (best.s.reg.yunits ? ' ' + best.s.reg.yunits : ''));

  /* ---------------------------------------------------------------- tabs */
  var TABS = [['plot', 'Spectra'], ['quant', 'Quantification'], ['depth', 'Depth profile'], ['figures', 'Figures'], ['meta', 'Metadata'],
              ['notes', 'Notes'], ['methods', 'Methods'], ['holder', 'Holder'],
              ['cameras', 'Camera images'], ['maps', 'SnapMaps']];
  function availableTabs() {
    var d = S.data;
    return TABS.filter(function (t) {
      if (t[0] === 'figures') return d.figures.length > 0;
      if (t[0] === 'quant') return V.quantGroups(S.specs).length > 0 ||
        d.samples.some(function (sm) { return !!sm.casaxps; });
      if (t[0] === 'depth') return profileSamples().length > 0;

  function showTab(name) {

  }
  function redrawTab() {
    if (S.tab === 'depth') drawDepth();
    else if (S.tab === 'holder') drawHolder();
    else if (S.tab === 'cameras') drawCamera();
    else if (S.tab === 'maps') { if (S.M.id) drawMapView(); else if ((S.data.maps || []).length) openMap(S.data.maps[0].id); }

  }
  function mapHover(e) {
    var m = currentMap(), p = mapPoint(e);
    if (!m || !p || S.M.drag) return;

    if (px) $('mapRead').textContent = 'x ' + Math.round(p[0]) + ' µm   y ' + Math.round(p[1]) + ' µm    pixel (' + px[0] + ', ' + px[1] + ')    value ' + V.fmtY(mapImage(m)[px[1] * m.nx + px[0]]);
  }
  function drawMapView() {
    var m = currentMap(), mc = $('mapCanvas'), sc = $('specCanvas'), M = S.M;
    if (!m || !mc) return;
    $('mapSel').value = m.id; $('mapScale').value = M.scale; $('mapBg').checked = M.bg; $('mapOv').checked = M.overlay && !!m.cam;
    $('mapOvField').style.display = m.cam ? '' : 'none';
    var C = colours(), W = mc.parentNode.clientWidth || 900, half = Math.max(280, (W - 12) / 2);

    if (!M.data) {
      [mc, sc].forEach(function (cv) {
        var ctx = sizeCanvas(cv, half, 200);
        ctx.fillStyle = C.bg; ctx.fillRect(0, 0, half, 200);
        ctx.fillStyle = C.muted; ctx.font = '13px system-ui, sans-serif'; ctx.textAlign = 'center';

    }

    var cam = M.overlay && m.cam ? S.camById[m.cam.id] : null;
    var vx0 = ext[0], vx1 = ext[1], vy0 = ext[2], vy1 = ext[3];
    if (cam) { var px = (ext[1] - ext[0]) * 0.3, py = (ext[3] - ext[2]) * 0.3; vx0 -= px; vx1 += px; vy0 -= py; vy1 += py; }

      ctx.fillStyle = C.bg; ctx.fillRect(0, 0, half, H);
      ctx.save(); ctx.beginPath(); ctx.rect(L, T, pw, ph); ctx.clip();
      if (photo) ctx.drawImage(photo, X(m.cam.ext[0]), Y(m.cam.ext[3]), (m.cam.ext[1] - m.cam.ext[0]) * sx, (m.cam.ext[2] - m.cam.ext[3]) * sy);
      ctx.globalAlpha = photo ? M.alpha : 1; ctx.imageSmoothingEnabled = false;
      ctx.drawImage(off, X(ext[0]), Y(ext[2]), (ext[1] - ext[0]) * sx, (ext[3] - ext[2]) * sy);
      ctx.globalAlpha = 1;
      var roi = M.drag && M.drag.kind === 'roi' ? [Math.min(M.drag.a[0], M.drag.b[0]), Math.min(M.drag.a[1], M.drag.b[1]), Math.max(M.drag.a[0], M.drag.b[0]), Math.max(M.drag.a[1], M.drag.b[1])] : M.roi;
      if (roi) { ctx.setLineDash([5, 3]); ctx.lineWidth = 1.6; ctx.strokeStyle = C.accent; ctx.strokeRect(X(roi[0]), Y(roi[1]), (roi[2] - roi[0]) * sx, (roi[3] - roi[1]) * sy); ctx.setLineDash([]); }
      ctx.restore();
      ctx.strokeStyle = C.muted; ctx.lineWidth = 1; ctx.strokeRect(L, T, pw, ph);
      ctx.fillStyle = C.muted; ctx.font = '11px system-ui, sans-serif'; ctx.textBaseline = 'top'; ctx.textAlign = 'center';
      V.niceTicks(vx0, vx1, 5).forEach(function (t) { ctx.fillText(String(t), X(t), T + ph + 4); });
      ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      V.niceTicks(vy0, vy1, 5).forEach(function (t) { ctx.fillText(String(t), L - 5, Y(t)); });
      ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.fillStyle = C.fg;
      ctx.fillText('X (µm)', L + pw / 2, H - 1);
      ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      ctx.fillText(m.name + '   ' + M.win[0].toFixed(1) + '–' + M.win[1].toFixed(1) + ' eV', L, 4);
      for (var s = 0; s < 64; s++) {                                   /* colour bar */
        var cc = V.scaleColour(M.scale, 1 - s / 63);

  function drawSpectrum(m, reg, cv, W, H, C) {
    var M = S.M, e = M.energy, ctx = sizeCanvas(cv, W, H), L = 58, R = 12, T = 26, B = 32, pw = W - L - R, ph = H - T - B;

    var e0 = e[0], e1 = e[e.length - 1], inv = !!reg.binding, a = inv ? Math.max(e0, e1) : Math.min(e0, e1), b = inv ? Math.min(e0, e1) : Math.max(e0, e1);
    var X = function (v) { return L + (v - a) / (b - a) * pw; }, Y = function (v) { return T + ph - (v - lo) / (hi - lo) * ph; };

    V.niceTicks(lo, hi, 5).forEach(function (t) { ctx.fillText(V.fmtY(t), L - 5, Y(t)); });

  /* selecting a sample (or a map's own spectrum) brings up its picture / map */

  /* ------------------------------------------------------------ download */

  }

  /* ---------------------------------------------------------------- setup */
